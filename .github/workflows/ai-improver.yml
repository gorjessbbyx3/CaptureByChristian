name: AI Code Improver

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && contains(github.event.label.name, 'ai-improve')) ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/improve'))
    
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.event.pull_request.head.ref || github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd client && npm ci

    - name: Get files to improve
      id: get-files
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Get PR diff files
          git fetch origin ${{ github.event.pull_request.base.ref }}
          FILES=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --name-only | grep -E '\.(ts|tsx|js|jsx)$' | head -5)
        else
          # Get files from comment context or recent changes
          FILES=$(git diff HEAD~1 --name-only | grep -E '\.(ts|tsx|js|jsx)$' | head -5)
        fi
        
        echo "files<<EOF" >> $GITHUB_OUTPUT
        echo "$FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: AI Code Improvement
      uses: actions/github-script@v7
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          if (!process.env.OPENAI_API_KEY) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue.number,
              body: '🤖 AI Code Improver is not configured (missing OpenAI API key). Please contact the repository admin.'
            });
            return;
          }
          
          const filesToImprove = `${{ steps.get-files.outputs.files }}`.split('\n').filter(f => f.trim());
          
          if (filesToImprove.length === 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue.number,
              body: '🤖 No TypeScript/JavaScript files found to improve.'
            });
            return;
          }

          const improvements = [];
          
          for (const filePath of filesToImprove) {
            if (!fs.existsSync(filePath)) continue;
            
            const fileContent = fs.readFileSync(filePath, 'utf8');
            
            // Skip files that are too large
            if (fileContent.length > 10000) {
              console.log(`Skipping ${filePath} - too large`);
              continue;
            }
            
            const improvePrompt = `You are an expert TypeScript/JavaScript developer. Please improve this code file while maintaining its functionality.

Focus on:
1. **Type Safety**: Add proper TypeScript types, fix any 'any' types
2. **Performance**: Optimize React renders, database queries, API calls
3. **Security**: Add input validation, sanitization, error handling
4. **Code Quality**: Improve readability, add JSDoc comments, follow best practices
5. **Error Handling**: Add comprehensive try/catch blocks and user-friendly error messages
6. **Accessibility**: Ensure UI components are accessible
7. **Modern Patterns**: Use modern React patterns, hooks, and ES6+ features

File: ${filePath}

\`\`\`typescript
${fileContent}
\`\`\`

Return ONLY the improved code without any explanations or markdown formatting. The output should be ready to replace the file content directly.`;

            try {
              const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'gpt-4',
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a senior full-stack developer specializing in React, TypeScript, Node.js, and PostgreSQL. You write clean, secure, and performant code.'
                    },
                    {
                      role: 'user',
                      content: improvePrompt
                    }
                  ],
                  max_tokens: 3000,
                  temperature: 0.1,
                }),
              });

              if (!response.ok) {
                console.error(`OpenAI API error for ${filePath}: ${response.status}`);
                continue;
              }

              const data = await response.json();
              let improvedCode = data.choices[0].message.content.trim();
              
              // Clean up the response (remove markdown if present)
              improvedCode = improvedCode.replace(/^```[\w]*\n/, '').replace(/\n```$/, '');
              
              // Only apply if the improved code is significantly different and valid
              if (improvedCode.length > 50 && improvedCode !== fileContent) {
                // Basic validation - check if it's still valid code structure
                if (improvedCode.includes('function') || improvedCode.includes('const') || improvedCode.includes('export')) {
                  fs.writeFileSync(filePath, improvedCode);
                  improvements.push({
                    file: filePath,
                    originalSize: fileContent.length,
                    improvedSize: improvedCode.length,
                    changed: true
                  });
                  console.log(`Improved ${filePath}`);
                }
              }
            } catch (error) {
              console.error(`Failed to improve ${filePath}:`, error);
              improvements.push({
                file: filePath,
                error: error.message,
                changed: false
              });
            }
          }

          // Check if we made any improvements
          const changedFiles = improvements.filter(i => i.changed);
          
          if (changedFiles.length > 0) {
            // Format the code using prettier if available
            try {
              const { execSync } = require('child_process');
              for (const improvement of changedFiles) {
                try {
                  execSync(`npx prettier --write "${improvement.file}"`, { stdio: 'pipe' });
                } catch (e) {
                  console.log(`Prettier not available for ${improvement.file}`);
                }
              }
            } catch (error) {
              console.log('Prettier formatting skipped');
            }
            
            // Create summary comment
            const summaryLines = [
              '## 🤖 AI Code Improvements Applied',
              '',
              'The following files have been automatically improved:',
              ''
            ];
            
            changedFiles.forEach(imp => {
              summaryLines.push(`- **${imp.file}** (${imp.originalSize} → ${imp.improvedSize} chars)`);
            });
            
            summaryLines.push('');
            summaryLines.push('**Improvements focus on:**');
            summaryLines.push('- ✅ Type safety and TypeScript best practices');
            summaryLines.push('- ✅ Performance optimizations');
            summaryLines.push('- ✅ Security enhancements');
            summaryLines.push('- ✅ Error handling');
            summaryLines.push('- ✅ Code readability and documentation');
            summaryLines.push('');
            summaryLines.push('*Please review the changes carefully before merging.*');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue.number,
              body: summaryLines.join('\n')
            });
            
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue.number,
              body: '🤖 No significant improvements could be applied to the analyzed files. The code quality is already good!'
            });
          }

    - name: Commit improvements
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "AI Code Improver"
        
        if [[ `git status --porcelain` ]]; then
          git add .
          git commit -m "🤖 AI code improvements

- Enhanced type safety and TypeScript usage
- Improved error handling and validation
- Optimized performance patterns
- Added better documentation
- Applied security best practices

Auto-generated by AI Code Improver"
          git push
        else
          echo "No changes to commit"
        fi

    - name: Run tests after improvements
      continue-on-error: true
      run: |
        npm run test 2>&1 | tee test-results.txt || true

    - name: Report test results
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          if (fs.existsSync('test-results.txt')) {
            const testResults = fs.readFileSync('test-results.txt', 'utf8');
            
            // Check if tests passed
            const testsPassed = testResults.includes('Tests:') && !testResults.includes('failed');
            const emoji = testsPassed ? '✅' : '⚠️';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.issue.number,
              body: `## ${emoji} Test Results After AI Improvements

\`\`\`
${testResults.slice(-2000)}
\`\`\`

${testsPassed ? 
  'All tests are passing after the AI improvements! 🎉' : 
  'Some tests may need attention after the improvements. Please review and fix any failing tests.'}`
            });
          }
