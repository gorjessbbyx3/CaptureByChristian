name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get PR diff
      id: pr-diff
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }}
        DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --name-only | grep -E '\.(ts|tsx|js|jsx)$' | head -10)
        echo "files=$DIFF" >> $GITHUB_OUTPUT
        
        # Get the actual diff content for analysis
        git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- $DIFF > pr_diff.txt || true

    - name: AI Code Review
      uses: actions/github-script@v7
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      with:
        script: |
          const fs = require('fs');
          
          // Skip if no OpenAI key is configured
          if (!process.env.OPENAI_API_KEY) {
            console.log('OpenAI API key not configured, skipping AI review');
            return;
          }
          
          const diffContent = fs.readFileSync('pr_diff.txt', 'utf8');
          
          if (!diffContent.trim()) {
            console.log('No significant changes found for review');
            return;
          }
          
          // Prepare the AI prompt
          const prompt = `You are an expert code reviewer for a photography business management platform built with React, TypeScript, Express, and PostgreSQL. Please review this pull request diff and provide constructive feedback.

          Focus on:
          1. Security vulnerabilities (especially important for a business app)
          2. Performance issues
          3. Code quality and best practices
          4. TypeScript type safety
          5. React patterns and hooks usage
          6. Database query efficiency
          7. Error handling
          8. Input validation

          Please be concise but thorough. Highlight critical issues and suggest improvements.

          PR Title: ${{ github.event.pull_request.title }}
          PR Description: ${{ github.event.pull_request.body }}

          Code Changes:
          \`\`\`diff
          ${diffContent.substring(0, 8000)}
          \`\`\``;

          try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'gpt-4',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a senior software engineer specializing in full-stack TypeScript applications with a focus on security and performance.'
                  },
                  {
                    role: 'user',
                    content: prompt
                  }
                ],
                max_tokens: 1500,
                temperature: 0.3,
              }),
            });

            if (!response.ok) {
              throw new Error(`OpenAI API error: ${response.status}`);
            }

            const data = await response.json();
            const aiReview = data.choices[0].message.content;

            // Post the AI review as a comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI Code Review

${aiReview}

---
*This review was generated by AI. Please use your judgment and consider having a human reviewer as well.*`
            });

          } catch (error) {
            console.error('AI review failed:', error);
            
            // Post a fallback comment with basic analysis
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI Code Review (Fallback)

I encountered an issue generating the AI review, but here's a quick analysis:

**Files Changed:** ${context.payload.pull_request.changed_files} files
**Lines Added:** +${context.payload.pull_request.additions}
**Lines Removed:** -${context.payload.pull_request.deletions}

**Automated Checks:**
- ✅ File count: ${context.payload.pull_request.changed_files < 20 ? 'Reasonable' : '⚠️ Large change set'}
- ✅ Size: ${context.payload.pull_request.additions + context.payload.pull_request.deletions < 500 ? 'Manageable' : '⚠️ Large diff'}

Please ensure:
1. All new API endpoints have proper input validation
2. Database queries are optimized and secure
3. Error handling is comprehensive
4. Tests are included for new functionality
5. No sensitive data is exposed

*AI review system is temporarily unavailable. Consider requesting a manual review.*`
            });
          }

  complexity-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Analyze code complexity
      run: |
        # Install complexity analysis tools
        npm install -g complexity-report
        
        # Analyze complexity for changed files
        echo "## Code Complexity Analysis" > complexity-report.md
        echo "" >> complexity-report.md
        
        # Get changed files
        git fetch origin ${{ github.event.pull_request.base.ref }}
        CHANGED_FILES=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --name-only | grep -E '\.(ts|tsx|js|jsx)$' | head -10)
        
        for file in $CHANGED_FILES; do
          if [ -f "$file" ]; then
            echo "### $file" >> complexity-report.md
            cr -f json "$file" | jq -r '
              if .reports and (.reports | length > 0) then
                .reports[0] | "- **Cyclomatic Complexity:** \(.complexity.cyclomatic)\n- **Lines of Code:** \(.loc)\n- **Maintainability Index:** \(.maintainability)"
              else
                "- No complexity data available"
              end
            ' >> complexity-report.md 2>/dev/null || echo "- Analysis failed for this file" >> complexity-report.md
            echo "" >> complexity-report.md
          fi
        done

    - name: Comment complexity analysis
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          if (fs.existsSync('complexity-report.md')) {
            const complexityReport = fs.readFileSync('complexity-report.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: complexityReport
            });
          }
