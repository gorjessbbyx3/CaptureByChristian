name: Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      github.event_name == 'check_suite'
      
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
    - name: Check if PR should be auto-merged
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          let prNumber;
          
          // Get PR number from different event types
          if (context.eventName === 'pull_request') {
            prNumber = context.payload.pull_request.number;
          } else if (context.eventName === 'pull_request_review') {
            prNumber = context.payload.pull_request.number;
          } else if (context.eventName === 'check_suite') {
            // Find PR associated with this check suite
            const prs = context.payload.check_suite.pull_requests;
            if (prs.length === 0) return;
            prNumber = prs[0].number;
          }
          
          if (!prNumber) {
            console.log('No PR number found');
            return;
          }
          
          // Get PR details
          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: prNumber
          });
          
          console.log(`Checking PR #${prNumber}: ${pr.title}`);
          
          // Check if PR has auto-merge label
          const hasAutoMergeLabel = pr.labels.some(label => 
            ['automerge', 'auto-merge', 'merge when ready'].includes(label.name.toLowerCase())
          );
          
          if (!hasAutoMergeLabel) {
            console.log('PR does not have auto-merge label');
            return;
          }
          
          // Check if PR is draft
          if (pr.draft) {
            console.log('PR is still a draft');
            return;
          }
          
          // Check if PR is mergeable
          if (pr.mergeable === false) {
            console.log('PR has merge conflicts');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '🚫 **Auto-merge blocked**: This PR has merge conflicts that need to be resolved.'
            });
            return;
          }
          
          // Get all reviews
          const { data: reviews } = await github.rest.pulls.listReviews({
            owner,
            repo,
            pull_number: prNumber
          });
          
          // Get latest review from each reviewer
          const latestReviews = {};
          reviews.forEach(review => {
            if (!latestReviews[review.user.login] || 
                new Date(review.submitted_at) > new Date(latestReviews[review.user.login].submitted_at)) {
              latestReviews[review.user.login] = review;
            }
          });
          
          const reviewStates = Object.values(latestReviews).map(r => r.state);
          const hasApproval = reviewStates.includes('APPROVED');
          const hasRequestedChanges = reviewStates.includes('CHANGES_REQUESTED');
          
          if (hasRequestedChanges) {
            console.log('PR has requested changes');
            return;
          }
          
          // Check if approval is required and present
          if (!hasApproval && pr.user.login !== 'dependabot[bot]') {
            console.log('PR needs approval (not from dependabot)');
            return;
          }
          
          // Get status checks
          const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
            owner,
            repo,
            ref: pr.head.sha
          });
          
          // Get check runs
          const { data: checkRuns } = await github.rest.checks.listForRef({
            owner,
            repo,
            ref: pr.head.sha
          });
          
          // Check if all required status checks pass
          const failedStatuses = statuses.statuses.filter(status => status.state === 'failure');
          const failedChecks = checkRuns.check_runs.filter(check => 
            check.conclusion === 'failure' || check.conclusion === 'cancelled'
          );
          
          if (failedStatuses.length > 0 || failedChecks.length > 0) {
            console.log('Some status checks are failing');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '🚫 **Auto-merge blocked**: Some required status checks are failing. Please fix the issues and try again.'
            });
            return;
          }
          
          // Check if all checks are completed
          const pendingStatuses = statuses.statuses.filter(status => status.state === 'pending');
          const runningChecks = checkRuns.check_runs.filter(check => 
            check.status === 'in_progress' || check.status === 'queued'
          );
          
          if (pendingStatuses.length > 0 || runningChecks.length > 0) {
            console.log('Some checks are still running');
            return;
          }
          
          // Special handling for dependabot PRs
          if (pr.user.login === 'dependabot[bot]') {
            // Auto-approve dependabot PRs for minor/patch updates
            const isDependencyUpdate = pr.title.toLowerCase().includes('bump') || 
                                     pr.title.toLowerCase().includes('update');
            const isMinorUpdate = !pr.title.toLowerCase().includes('major');
            
            if (isDependencyUpdate && isMinorUpdate) {
              console.log('Auto-approving dependabot minor/patch update');
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                body: '🤖 Auto-approving dependency update',
                event: 'APPROVE'
              });
            }
          }
          
          // All conditions met - merge the PR
          console.log('All conditions met, merging PR');
          
          try {
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              commit_title: `${pr.title} (#${prNumber})`,
              commit_message: `${pr.body || ''}\n\nAuto-merged by GitHub Actions`,
              merge_method: 'squash' // Use squash merge for cleaner history
            });
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '✅ **Auto-merged successfully!** All checks passed and requirements were met.'
            });
            
            console.log(`Successfully merged PR #${prNumber}`);
            
          } catch (error) {
            console.error('Failed to merge PR:', error);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `🚫 **Auto-merge failed**: ${error.message}`
            });
          }

  cleanup-merged-branches:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    
    steps:
    - name: Delete merged branch
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const branchName = context.payload.pull_request.head.ref;
          const isFromFork = context.payload.pull_request.head.repo.full_name !== context.payload.repository.full_name;
          
          // Don't delete branches from forks or protected branches
          if (isFromFork || ['main', 'master', 'develop', 'trunk'].includes(branchName)) {
            console.log(`Skipping branch deletion for ${branchName}`);
            return;
          }
          
          try {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branchName}`
            });
            console.log(`Deleted merged branch: ${branchName}`);
          } catch (error) {
            console.log(`Could not delete branch ${branchName}: ${error.message}`);
          }
