services:
  - type: web
    name: capturebychristian
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: capturebychristian-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /health

databases:
  - name: capturebychristian-db
    databaseName: capturedccollective
    user: postgresuser
    region: oregon
    plan: starter
