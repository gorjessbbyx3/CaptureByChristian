services:
  # Main Application Service
  - type: web
    name: capturedbychristian-app
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:production
    nodeVersion: "20"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: hostHeader
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - package*.json
        - server/**
        - client/**
        - migrations/**
        - shared/**
        - attached_assets/**
        - build-server.js
        - tsconfig.build.json
        - drizzle.config.ts
    autoDeploy: true
    
  # PostgreSQL Database
  - type: pgsql
    name: capturedbychristian-db
    plan: starter
    region: oregon
    databaseName: capturedcollective
    databaseUser: postgres
    
  # Redis for caching (optional)
  - type: redis
    name: capturedbychristian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

# Previews for PRs  
previews:
  generation: automatic
  expiration: 7d
