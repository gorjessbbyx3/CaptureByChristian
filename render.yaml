services:
  # Main Application Service
  - type: web
    name: capturedbychristian-app
    runtime: node
    # Uses optimized render:build and render:start commands from package.json
    buildCommand: npm run render:build
    startCommand: npm run render:start
    nodeVersion: "20"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - package*.json
        - server/**
        - client/**
        - migrations/**
        - shared/**
    autoDeploy: true

  # PostgreSQL Database
  - type: pgsql
    name: capturedbychristian-db
    plan: starter
    region: oregon
    databaseName: capturedcollective
    databaseUser: postgres

  # Redis for caching (optional)
  - type: redis
    name: capturedbychristian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

# Environment-specific configurations
environments:
  - name: production
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: host

# Previews for PRs
previews:
  generation: automatic
  expiration: 7d
