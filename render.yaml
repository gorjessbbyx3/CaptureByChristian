services:
  # Main Application Service
  - type: web
    name: capturedbychristian-app
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    nodeVersion: "18"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    buildFilter:
      paths:
        - package*.json
        - server/**
        - client/**
        - migrations/**
        - shared/**
    autoDeploy: true
    
  # PostgreSQL Database
  - type: pserv
    name: capturedbychristian-db
    runtime: postgresql
    plan: starter
    databaseName: capturedcollective
    databaseUser: postgres
    ipAllowList: []  # Allow all connections
    
  # Redis for caching (optional)
  - type: pserv
    name: capturedbychristian-redis
    runtime: redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

# Environment-specific configurations
environments:
  - name: production
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: host
          
# Previews for PRs
previews:
  generation: automatic
  expiration: 7d
