services:
  # Main Application
  - type: web
    name: capturedbychristian-app
    runtime: node
    buildCommand: npm install && npm run build && node debug-build.js
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: capturedbychristian-app
          property: port
    healthCheckPath: /api/health
    initialDeployDelay: 30
    
  # PostgreSQL Database
  - type: pserv
    name: capturedbychristian-db
    runtime: postgresql
    plan: starter
    databaseName: capturedcollective
    databaseUser: postgres
    
environments:
  - name: production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: NODE_ENV
        value: production
